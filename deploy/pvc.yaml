# The SQLite database and its nightly snapshots, mounted at /data.
# No storageClassName, so it uses the cluster default (MicroK8s hostpath-storage).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asgard-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
