apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgard
  labels:
    app: asgard
spec:
  # One process writes the SQLite file, and the old pod stops before the new one starts (ADR 0004).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: asgard
  template:
    metadata:
      labels:
        app: asgard
    spec:
      # The package on ghcr.io is private; the Secret is created by hand (docs/operations.md).
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The volume at /data hides the image's ownership of it.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: asgard
          # A release version, never :latest. Upgrading means changing this tag.
          image: ghcr.io/josefjura/asgard:0.2.0
          ports:
            - name: http
              containerPort: 8080
          # DATABASE_URL, BACKUP_DIR and PORT come from the image and point into /data.
          env:
            - name: PUBLIC_URL
              value: https://asgard.joseforge.cz
            - name: RUST_LOG
              value: info
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: asgard-secrets
                  key: VAPID_PRIVATE_KEY
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            # Migrations run before the server listens.
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            # SQLite's temporary files, since the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asgard-data
        - name: tmp
          emptyDir: {}
