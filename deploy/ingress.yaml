apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asgard
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - asgard.joseforge.cz
      secretName: asgard-prod-tls
  rules:
    - host: asgard.joseforge.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asgard
                port:
                  name: http
