# A template only: never commit it with a real value. Copy it outside the repository,
# paste the key, and encrypt it with sops as described in docs/operations.md (Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: asgard-secret
  namespace: asgard
type: Opaque
stringData:
  # Raw P-256 private key, base64url without padding. See docs/operations.md (VAPID key).
  vapid-private-key: ""
